      <div><label class="field">Archivo comunicado</label><input type="file" id="pu-archivo-comunicado">${docLink(p.archivoComunicado)}</div>
    </div>
    <div class="row grid3">
      <div><label class="field">Acción tomada</label><select id="pu-accion"><option ${p.accion==="Llamado de atención"?"selected":""}>Llamado de atención</option><option ${p.accion==="Suspensión"?"selected":""}>Suspensión</option></select></div>
      <div id="pu-dias-wrap" class="${p.accion==="Suspensión"?"":"hidden"} grid2" style="gap:10px">
        <div><label class="field">Suspensión desde</label><input type="date" id="pu-susp-inicio" value="${p.suspInicio||""}"></div>
        <div><label class="field">Suspensión hasta</label><input type="date" id="pu-susp-fin" value="${p.suspFin||""}"></div>
      </div>
      <div><label class="field">Observaciones</label><input id="pu-obs" value="${esc(p.observaciones||"")}"></div>
    </div>
    <div class="err" id="pu-err"></div>
    <div class="actions"><button class="btn btn-primary" onclick="saveProcesoUpdate('${p.id}')">Guardar actualización</button></div>`;
  document.getElementById("pu-accion").onchange=e=>document.getElementById("pu-dias-wrap").classList.toggle("hidden",e.target.value!=="Suspensión");
  document.getElementById("procupd-modal").classList.add("open");
}
function closeProcesoUpdate(){ document.getElementById("procupd-modal").classList.remove("open"); document.getElementById("procupd-body").innerHTML=""; }
async function saveProcesoUpdate(id){
  const p=procesos.find(x=>x.id===id);
  if(!p) return;
  const err=document.getElementById("pu-err"); err.textContent="";
  const fechaApertura=document.getElementById("pu-apertura").value;
  const fechaDescargos=document.getElementById("pu-descargos").value;
  const fechaComunicado=document.getElementById("pu-comunicado").value;
  const accion=document.getElementById("pu-accion").value;
  const suspInicio=document.getElementById("pu-susp-inicio").value;
  const suspFin=document.getElementById("pu-susp-fin").value;
  const observaciones=document.getElementById("pu-obs").value.trim();
  const fArchivoApertura=document.getElementById("pu-archivo-apertura").files[0];
  const fArchivoDescargos=document.getElementById("pu-archivo-descargos").files[0];
  const fArchivoComunicado=document.getElementById("pu-archivo-comunicado").files[0];
  if(!fechaApertura){err.textContent="La fecha de apertura es obligatoria.";return}
  if(accion==="Suspensión"&&(!suspInicio||!suspFin)){err.textContent="Indica la fecha de inicio y de fin de la suspensión.";return}
  if(accion==="Suspensión"&&suspFin<suspInicio){err.textContent="La fecha de fin de suspensión no puede ser antes de la fecha de inicio.";return}
  const diasSuspension=accion==="Suspensión"?(Math.round((new Date(suspFin+"T00:00:00")-new Date(suspInicio+"T00:00:00"))/86400000)+1):0;
  p.fechaApertura=fechaApertura; p.fechaDescargos=fechaDescargos; p.fechaComunicado=fechaComunicado;
  p.accion=accion; p.suspInicio=accion==="Suspensión"?suspInicio:null; p.suspFin=accion==="Suspensión"?suspFin:null; p.diasSuspension=diasSuspension; p.observaciones=observaciones;
  if(fArchivoApertura) p.archivoApertura=await fileToDataURL(fArchivoApertura);
  if(fArchivoDescargos) p.archivoDescargos=await fileToDataURL(fArchivoDescargos);
  if(fArchivoComunicado) p.archivoComunicado=await fileToDataURL(fArchivoComunicado);
  await saveProcesos();
  const w=workersCompany().find(x=>x.cedula===p.cedula);
  records=records.filter(r=>!(r.origen==="proceso"&&r.procesoId===id));
  if(accion==="Suspensión"&&diasSuspension>0&&w){
    records.push({id:Date.now()+"-susp","nombre":w.nombre,cedula:p.cedula,empresa:activeCompany,cargo:w.cargo,categoria:"Suspensión",entidad:null,inicio:suspInicio,fin:suspFin,dias:diasSuspension,observacion:"Proceso disciplinario: "+p.motivo,attachment:null,origen:"proceso",procesoId:p.id});
  }
  await saveRecords();
  closeProcesoUpdate();
  renderSection("procesos-disciplinarios");
}

/* ===================== USUARIOS ===================== */
function permissionLabel(leaf){
  for(const c of NAV){ if(c.subs){ const s=c.subs.find(x=>x.id===leaf); if(s) return s.label; } else if(c.id===leaf) return c.label; }
  return leaf;
}
function usuariosHTML(){
  const rows=users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.user)}</td><td>${esc(u.cargo||"—")}</td><td>${u.role==="admin"?"ADMINISTRADOR":"USUARIO"}</td><td><button class="btn btn-light btn-small" onclick="editUser('${u.id}')">Editar</button> ${u.id===sessionUser.id?"":`<button class="btn btn-danger btn-small" onclick="deleteUser('${u.id}')">Eliminar</button>`}</td></tr>`).join("");
  return `<div class="card" id="users-card">
    <p class="card-title">👥 Usuarios y permisos</p>
    <p class="hint">Crea usuarios, define su cargo, si son ADMINISTRADOR o USUARIO, y a qué módulos tienen acceso.</p>
    <div class="user-form">
      <div><label class="field">Nombre</label><input id="new-name"></div>
      <div><label class="field">Cargo</label><input id="new-cargo"></div>
      <div><label class="field">Usuario</label><input id="new-user"></div>
      <div><label class="field">Contraseña</label><input id="new-pass" type="password"></div>
      <button class="btn btn-primary" id="btn-create-user">Crear</button>
    </div>
    <div class="table-wrap" style="margin-top:20px"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Cargo</th><th>Tipo</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div id="user-editor"></div>
  </div>`;
}
function bindUsuarios(){document.getElementById("btn-create-user").onclick=createUser}
async function createUser(){
  const name=document.getElementById("new-name").value.trim();
  const cargo=document.getElementById("new-cargo").value.trim();
  const user=document.getElementById("new-user").value.trim();
  const pass=document.getElementById("new-pass").value;
  if(!name||!user||!pass)return alert("Completa nombre, usuario y contraseña.");
  if(users.some(u=>u.user.toLowerCase()===user.toLowerCase()))return alert("Ese usuario ya existe.");
  users.push({id:Date.now()+"",name,user,password:pass,role:"usuario",cargo,permissions:[]});
  await saveUsers();
  renderSection("usuarios");
}
function editUser(id){
  const u=users.find(x=>x.id===id); if(!u)return;
  const checks=LEAF_MODULES.map(m=>`<label style="display:block;margin:6px 0"><input type="checkbox" class="perm-check" value="${esc(m)}" ${(u.permissions||[]).includes(m)?"checked":""}> ${permissionLabel(m)}</label>`).join("");
  document.getElementById("user-editor").innerHTML=`<div class="card" style="margin-top:16px">
    <p class="card-title">Editar a ${esc(u.name)}</p>
    <div class="grid4">
      <div><label class="field">Nombre</label><input id="edit-name" value="${esc(u.name)}"></div>
      <div><label class="field">Cargo</label><input id="edit-cargo" value="${esc(u.cargo||"")}"></div>
      <div><label class="field">Usuario</label><input id="edit-user" value="${esc(u.user)}"></div>
      <div><label class="field">Nueva contraseña (opcional)</label><input id="edit-pass" type="password" placeholder="Dejar en blanco para no cambiar"></div>
    </div>
    <div class="row"><label class="field">Tipo de usuario</label><select id="edit-role"><option value="usuario" ${u.role==="usuario"?"selected":""}>USUARIO</option><option value="admin" ${u.role==="admin"?"selected":""}>ADMINISTRADOR</option></select></div>
    <div class="row"><p class="card-title" style="font-size:13px">Módulos permitidos</p>${checks}</div>
    <div class="actions"><button class="btn btn-primary" onclick="saveUserEdit('${u.id}')">Guardar cambios</button><button class="btn btn-light" onclick="document.getElementById('user-editor').innerHTML=''">Cancelar</button></div>
  </div>`;
}
async function saveUserEdit(id){
  const u=users.find(x=>x.id===id); if(!u)return;
  const name=document.getElementById("edit-name").value.trim();
  const cargo=document.getElementById("edit-cargo").value.trim();
  const user=document.getElementById("edit-user").value.trim();
  const pass=document.getElementById("edit-pass").value;
  const role=document.getElementById("edit-role").value;
  if(!name||!user)return alert("Nombre y usuario no pueden quedar vacíos.");
  if(users.some(x=>x.id!==id&&x.user.toLowerCase()===user.toLowerCase()))return alert("Ese nombre de usuario ya lo tiene otra persona.");
  if(u.role==="admin"&&role!=="admin"&&users.filter(x=>x.role==="admin").length<=1)return alert("Debe existir al menos un administrador.");
  u.name=name;u.cargo=cargo;u.user=user;if(pass)u.password=pass;u.role=role;
  u.permissions=role==="admin"?LEAF_MODULES.slice():[...document.querySelectorAll(".perm-check:checked")].map(x=>x.value);
  await saveUsers();
  if(sessionUser.id===u.id){ sessionUser=u; document.getElementById("session-user").innerHTML="<strong>"+esc(u.name)+"</strong>"+esc(u.cargo||""); applyPermissions(); }
  renderSection("usuarios");
}
async function deleteUser(id){
  const u=users.find(x=>x.id===id); if(!u)return;
  if(u.id===sessionUser.id)return alert("No puedes eliminar tu propio usuario mientras tienes la sesión iniciada.");
  if(u.role==="admin"&&users.filter(x=>x.role==="admin").length<=1)return alert("Debe existir al menos un administrador.");
  if(confirm("¿Eliminar al usuario "+u.name+"?")){
    users=users.filter(x=>x.id!==id);
    await saveUsers();
    renderSection("usuarios");
  }
}

(async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session&&session.user){
    await loadAll();
    const username=(session.user.email||"").split("@")[0];
    const uObj=users.find(x=>x.user.toLowerCase()===username.toLowerCase());
    if(uObj) enterApp(uObj);
    else await sb.auth.signOut();
  }
})();
</script>
