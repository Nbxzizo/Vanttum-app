<style>
:root{
  --ink:#1c2733;--ink-soft:#6b7684;--line:#e3e7ee;--paper:#eef1f6;
  --card:#fff;--accent:#12294a;--accent2:#1d3f6e;--accent-soft:#e8eefc;
  --gold:#c99a2e;--gold-soft:#faf1dc;
  --danger:#b42318;--danger-soft:#fde8e6;--warn:#b7791f;--warn-soft:#fdf3dd;--ok:#1e7a4c;--shadow:0 8px 25px rgba(18,41,74,.08);
  --blue:#2f6fed;--blue-soft:#e8f0ff;--purple:#7c5cf0;--purple-soft:#efeafd;--green:#1fa363;--green-soft:#e4f7ec;--orange:#e08a2c;--orange-soft:#fdf0e0;--pink:#e0538a;--pink-soft:#fdeaf2;--indigo:#5c6cf0;--indigo-soft:#eaecfd;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{color:var(--accent)}
/* ---------- login ---------- */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:linear-gradient(135deg,#edf3ee,#f8f8f4)}
.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:var(--shadow)}
.login-brand{text-align:center;margin-bottom:25px}
.login-brand .mark{width:76px;height:76px;border-radius:20px;background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;font-size:25px;font-weight:800;padding:8px}
.login-brand h1{font-size:22px;margin:0 0 6px}.login-brand p{color:var(--ink-soft);font-size:13px;margin:0}
.form-group{margin-bottom:15px}.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--ink-soft)}
.form-group input,.form-group select{width:100%;padding:11px 12px;border:1px solid #c7cdd6;border-radius:8px;background:#fff}
.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#264a39}
.btn-light{background:#fff;border:1px solid var(--line);color:var(--accent)}
.btn-gold{background:var(--gold);color:#fff}
.btn-danger{background:var(--danger);color:#fff}.btn-small{font-size:11px;padding:7px 10px}
.login-error{background:var(--danger-soft);color:var(--danger);padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px}
/* ---------- shell ---------- */
.app{display:none;min-height:100vh}.app.visible{display:flex}
.icon-rail{width:66px;background:#fff;border-right:1px solid var(--line);min-height:100vh;position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;z-index:22}
.icon-rail .rail-logo{width:38px;height:38px;border-radius:10px;background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-bottom:14px}
.icon-rail button{width:42px;height:42px;border:0;background:transparent;border-radius:11px;font-size:18px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center}
.icon-rail button:hover{background:var(--paper)}
.icon-rail button.active{background:var(--accent-soft);color:var(--accent)}
.side-panel{width:225px;background:#fff;border-right:1px solid var(--line);min-height:100vh;position:fixed;left:66px;top:0;bottom:0;padding:22px 14px;overflow-y:auto;z-index:21}
.side-panel .panel-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:800;margin:0 0 14px 8px}
.company-switch{padding:0 4px 16px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.company-switch label{font-size:9.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:800;display:block;margin-bottom:6px}
.company-switch select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:11.5px}
.panel-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:10px 10px;border-radius:9px;margin-bottom:2px;font-weight:600;font-size:12.5px}
.panel-item:hover{background:var(--paper)}
.panel-item.active{background:var(--accent-soft);color:var(--accent);font-weight:800}
.main{margin-left:291px;width:calc(100% - 291px);padding:0 30px 45px}
.topbar2{display:flex;align-items:center;justify-content:space-between;padding:16px 0;margin-bottom:8px;position:sticky;top:0;background:var(--paper);z-index:10}
.topbar2 .tb-title{font-size:19px;font-weight:800;margin:0}
.topbar2 .tb-actions{display:flex;align-items:center;gap:14px}
.tb-icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;color:var(--ink-soft)}
.tb-badge{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;border-radius:20px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.avatar-circle{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;position:relative;flex-shrink:0}
.avatar-dot{position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.user-menu{position:relative}
.user-menu-drop{display:none;position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px;min-width:170px;z-index:30}
.user-menu-drop.open{display:block}
.user-menu-drop .um-name{font-size:12px;font-weight:800;margin:0 0 2px}
.user-menu-drop .um-cargo{font-size:10.5px;color:var(--ink-soft);margin:0 0 10px}
.company-hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;align-items:center;justify-content:center;min-height:130px;margin-bottom:18px;box-shadow:var(--shadow)}
.company-logo{max-width:260px;max-height:105px;object-fit:contain}.logo-placeholder{text-align:center}.logo-placeholder .logo-box{width:90px;height:90px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:26px;font-weight:800}.logo-placeholder strong{font-size:16px}
/* ---------- panel / dashboard ---------- */
.greeting-banner{background:linear-gradient(120deg,#0c1e38,#1d4a7a);border-radius:20px;padding:34px 40px;color:#fff;position:relative;overflow:hidden;margin-bottom:20px;min-height:150px}
.greeting-banner .gb-circle{position:absolute;border-radius:50%;background:rgba(255,255,255,.06)}
.greeting-banner .gb-eyebrow{font-size:10.5px;letter-spacing:1.5px;font-weight:800;color:#a9c3e6;text-transform:uppercase;margin:0 0 8px}
.greeting-banner h1{font-size:30px;margin:0 0 12px;font-weight:800}
.greeting-banner p{font-size:13px;color:#dbe6f4;max-width:520px;line-height:1.6;margin:0;position:relative}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat-card2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px}
.stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat-card2 .stat-label{font-size:11px;color:var(--ink-soft);margin:0 0 3px}
.stat-card2 .stat-num{font-size:19px;font-weight:800;margin:0}
.quick-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:0 0 14px}
.quick-title .bar{width:4px;height:16px;background:var(--accent);border-radius:3px}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:10px}
.quick-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;gap:13px;cursor:pointer}
.quick-card:hover{border-color:var(--accent)}
.quick-card .qc-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.quick-card .qc-title{font-size:13px;font-weight:800;margin:0 0 3px}
.quick-card .qc-desc{font-size:11px;color:var(--ink-soft);margin:0;line-height:1.5}
.quick-card .qc-arrow{margin-left:auto;color:var(--ink-soft);font-size:16px}
.app-footer{display:flex;align-items:center;justify-content:space-between;padding:18px 0;margin-top:10px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-soft)}
.app-footer .af-company{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink)}
.app-footer .af-company img{width:20px;height:20px;object-fit:contain;border-radius:4px}
/* ---------- file viewer modal ---------- */
.file-viewer-modal{display:none;position:fixed;inset:0;background:rgba(12,20,33,.6);z-index:100;align-items:center;justify-content:center;padding:24px}
.file-viewer-modal.open{display:flex}
.file-viewer-card{background:#fff;border-radius:14px;max-width:900px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.file-viewer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.file-viewer-head p{font-weight:800;font-size:13px;margin:0;word-break:break-all}
.file-viewer-body{padding:16px;overflow:auto}
/* ---------- ficha resumen ---------- */
.ficha-resumen-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:12px;margin-top:14px}
.ficha-resumen-grid div span{display:block;font-size:10px;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
.doc-mini-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.doc-mini-row:last-child{border-bottom:0}
.doc-mini-name{font-size:11.5px;font-weight:700;flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 3px 14px rgba(31,42,36,.04);margin-bottom:18px}
.card-title{font-size:15px;font-weight:800;margin:0 0 4px}.hint{font-size:11px;color:var(--ink-soft);margin:0 0 17px}
.grid4{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.field{display:block;font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:5px}
label.field .req{color:var(--danger)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c7cdd6;border-radius:7px;background:#fff;color:var(--ink);font-size:12px}
textarea{resize:vertical;font-family:Arial,Helvetica,sans-serif}
.row{margin-top:12px}.actions{display:flex;gap:9px;align-items:center;margin-top:15px;flex-wrap:wrap}.err{color:var(--danger);font-size:11px}

.table-grid table{border:1px solid var(--line)}
.table-grid th,.table-grid td{border:1px solid var(--line)}
.table-grid th{font-size:11px;color:var(--ink);background:var(--paper)}
.table-grid tfoot td{background:var(--paper)}
.text-red{color:var(--danger)!important}
.badge{display:inline-block;border-radius:20px;padding:3px 9px;font-size:9.5px;font-weight:800}
.badge-ok{background:#e2f3e9;color:var(--ok)}.badge-warn{background:var(--warn-soft);color:var(--warn)}.badge-vencido{background:var(--danger-soft);color:var(--danger)}

.user-form{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
.notice{padding:10px 12px;background:#f1f5f2;border:1px solid var(--line);border-radius:8px;color:var(--ink-soft);font-size:11px;margin-bottom:15px}
.notice-warn{background:var(--warn-soft);border-color:#eddca6;color:var(--warn)}
/* ---------- nómina: orden y colores por cargo ---------- */
.nom-order-cell{white-space:nowrap;text-align:center}
.btn-order{border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:6px;width:24px;height:22px;font-size:10px;padding:0;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.btn-order:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn-order:disabled{opacity:.3;cursor:default}
.lock-cell{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end}
.per-day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}

.nomcal-cell{text-align:center;cursor:pointer;font-size:13px;color:#c8cdd6}

/* ---------- doc checklist / progress ---------- */
.progress-wrap{background:#eef1ec;border-radius:20px;height:10px;overflow:hidden;margin:6px 0 3px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:20px;transition:width .3s}
.progress-label{font-size:11px;color:var(--ink-soft);font-weight:700}
.doc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.doc-row:last-child{border-bottom:0}
.doc-name{flex:0 0 210px;font-size:12px;font-weight:700}
.doc-name .req{color:var(--danger)}
.doc-status{width:22px;text-align:center;font-size:14px}
.doc-file{flex:1}
.doc-view{font-size:11px;white-space:nowrap}
/* ---------- worker photo / ficha ---------- */
.photo-upload{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.photo-preview{width:86px;height:86px;border-radius:14px;object-fit:cover;background:var(--accent-soft);border:1px solid var(--line)}
.ficha-head{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.ficha-photo{width:110px;height:110px;border-radius:16px;object-fit:cover;border:1px solid var(--line);background:var(--accent-soft)}
.ficha-datos{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:12px}
.ficha-datos div span{display:block;font-size:10px;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
.worker-list-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer}
.worker-list-item:hover{border-color:var(--accent)}
.worker-list-item.selected{background:var(--accent-soft);border-color:var(--accent)}
/* ---------- committee cards ---------- */
.committee-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.committee-card{border:2px solid var(--ink);border-radius:16px;padding:14px;background:#fff}
.committee-card h3{margin:0 0 10px;text-align:center;font-size:13px}
.member-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:40px;padding:6px 12px 6px 6px;margin-bottom:8px}
.member-photo{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--accent-soft)}
.member-info strong{display:block;font-size:11.5px}.member-info em{font-size:10.5px;color:var(--ink-soft)}
.member-row button{margin-left:auto;background:none;border:0;color:var(--danger);font-size:14px}
/* ---------- hoja de vida ---------- */
.cv-sheet{background:#fff;border:1px solid var(--line);border-radius:10px;padding:30px;max-width:680px;margin:0 auto}
.cv-sheet h2{margin:0 0 2px;font-size:20px}.cv-sheet .cv-cargo{color:var(--ink-soft);margin:0 0 18px;font-size:13px}
.cv-sheet table{width:100%}.cv-sheet td{border:0;padding:5px 0;font-size:12.5px}
.cv-sheet td:first-child{font-weight:800;width:150px;color:var(--ink-soft);text-transform:uppercase;font-size:10px}
/* ---------- hoja de vida (boceto morado) ---------- */
.cv2-wrap{display:flex;max-width:820px;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#0f2038}
.cv2-side{width:270px;flex-shrink:0;background:#0a1930;padding:26px 22px;color:#f2f4f8}
.cv2-photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;border:3px solid #c9a94f;margin-bottom:18px;background:#1b2f4d}
.cv2-photo-placeholder{width:100%;aspect-ratio:1/1;border-radius:14px;border:3px solid #c9a94f;margin-bottom:18px;background:#1b2f4d;display:flex;align-items:center;justify-content:center;font-size:11px;color:#dfe6f0;text-align:center}
.cv2-side h3{font-size:11px;letter-spacing:1.5px;color:#d8bb6c;border-bottom:2px solid rgba(216,187,108,.4);padding-bottom:6px;margin:20px 0 10px;text-transform:uppercase}
.cv2-contact-item{display:flex;gap:8px;align-items:flex-start;font-size:11px;margin-bottom:9px;word-break:break-word;color:#e7ecf3}
.cv2-side ul{margin:0;padding-left:16px;font-size:11.5px;line-height:1.8;color:#e7ecf3}
.cv2-edu-item{margin-bottom:12px;font-size:11px;line-height:1.5;color:#e7ecf3}
.cv2-edu-item strong{display:block;font-size:11.5px;color:#fff}
.cv2-main{flex:1;background:#132a49;padding:30px 28px;min-width:0}
.cv2-name{font-family:'Dancing Script',cursive;font-size:34px;color:#d8bb6c;margin:0;line-height:1.1}
.cv2-name-sub{font-size:21px;font-weight:800;color:#fff;margin:0 0 18px}
.cv2-main h4{font-size:12px;letter-spacing:1.5px;color:#d8bb6c;border-bottom:2px solid rgba(216,187,108,.35);padding-bottom:6px;margin:20px 0 10px;text-transform:uppercase}
.cv2-main p{font-size:12px;line-height:1.7;color:#e7ecf3;margin:0}
.cv2-exp-item{margin-bottom:14px}
.cv2-exp-item .exp-title{font-size:12.5px;font-weight:800;color:#fff}
.cv2-exp-item .exp-title:before{content:"● ";color:#d8bb6c}
.cv2-exp-item .dates{font-size:10.5px;color:#a9b8cc;display:block;margin:2px 0 5px}
.cv2-exp-item .desc{font-size:11.5px;line-height:1.6;color:#dde4ee}
.cv-editor-row{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;position:relative}
.cv-editor-row .btn-remove-row{position:absolute;top:8px;right:8px}
.cv-tag{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:4px 10px;font-size:11px;margin:0 6px 6px 0}
.cv-tag button{background:none;border:0;color:var(--accent);font-size:12px;line-height:1}
@media print{.cv2-wrap{box-shadow:none}}
/* ---------- generar documento ---------- */
.doc-preview{background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px;white-space:pre-wrap;font-size:13px;line-height:1.7;min-height:200px}
.check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px}
.check-grid label{font-size:11.5px;display:flex;align-items:center;gap:6px;font-weight:600}
@media print{
  .icon-rail,.side-panel,.topbar2,.no-print,.app-footer{display:none!important}
  .main{margin-left:0!important;width:100%!important;padding:0!important}
  body{background:#fff}
}

/* ===================== ALMACENAMIENTO (Supabase) ===================== */
async function storeGet(k){
  try{
    const {data,error}=await sb.from("app_data").select("value").eq("key",k).maybeSingle();
    if(error){ console.error("Error leyendo de Supabase:",error); return null; }
    return data?JSON.stringify(data.value):null;
  }catch(e){ console.error("Error leyendo de Supabase:",e); return null; }
}
async function storeSet(k,v){
  try{
    const {error}=await sb.from("app_data").upsert({key:k,value:JSON.parse(v),updated_at:new Date().toISOString()});
    if(error){ console.error("Error guardando en Supabase:",error); alert("No se pudo guardar en la nube: "+error.message); }
  }catch(e){
    console.error("Error guardando en Supabase:",e);
    alert("No se pudo guardar en la nube. Revisa tu conexión a internet.");
  }
}
async function loadAll(){
  const [r,w,u,l,c,cd,cap,com,pr,nm,ct,no,cc,pp,dg,fe,rc]=await Promise.all([
    storeGet(KEYS.records),storeGet(KEYS.workers),storeGet(KEYS.users),storeGet(KEYS.logos),storeGet(KEYS.company),
    storeGet(KEYS.companyDocs),storeGet(KEYS.capacitaciones),storeGet(KEYS.comites),storeGet(KEYS.procesos),storeGet(KEYS.nominaManual),storeGet(KEYS.customTemplates),storeGet(KEYS.nominaOrder),storeGet(KEYS.cargoColors),storeGet(KEYS.presupuesto),storeGet(KEYS.docsGenericos),storeGet(KEYS.festivos),storeGet(KEYS.recargoCalc)
  ]);
  records=r?JSON.parse(r):[];
  workers=w?JSON.parse(w):[];
  users=u?JSON.parse(u):defaultUsers();
  const PERM_MIGRATION={"nomina":["nomina-liquidacion","nomina-calendario"],"sst-procesos":["procesos-disciplinarios"],"sst-capacitaciones":["sst-planear"],"sst-comites":["sst-planear"],"sst-presupuesto":["sst-planear"],"hacer":["sst-hacer"],"verificar":["sst-verificar"]};
  function migratePerms(perms){
    if(!perms) return perms;
    const out=[];
    perms.forEach(p=>{ if(PERM_MIGRATION[p]) out.push(...PERM_MIGRATION[p]); else out.push(p); });
    return [...new Set(out)];
  }
  users=users.map(x=>({...x,role:x.role||"usuario",permissions:x.role==="admin"?LEAF_MODULES.slice():migratePerms(x.permissions)||LEAF_MODULES.slice(),cargo:x.cargo||""}));
  logos=l?JSON.parse(l):{...LOGO_DEFAULTS};
  activeCompany=c&&COMPANIES.includes(c)?c:COMPANIES[0];
  companyDocs=cd?JSON.parse(cd):[];
  capacitaciones=cap?JSON.parse(cap):[];
  comites=com?JSON.parse(com):{};
  procesos=pr?JSON.parse(pr):[];
  nominaManual=nm?JSON.parse(nm):{};
  customTemplates=ct?JSON.parse(ct):[];
  nominaOrder=no?JSON.parse(no):{};
  cargoColors=cc?JSON.parse(cc):{};
  presupuesto=pp?JSON.parse(pp):{};
  docsGenericos=dg?JSON.parse(dg):{hacer:{},verificar:{}};
  festivos=fe?JSON.parse(fe):{};
  recargoCalc=rc?JSON.parse(rc):{};
  if(!u) await saveUsers();
  if(!l){ await saveLogos(); }
}

/* ===================== HELPERS ===================== */
function daysBetween(a,b){let d1=new Date(a+"T00:00:00"),d2=new Date(b+"T00:00:00");return Math.max(0,Math.round((d2-d1)/86400000)+1)}
function fmtDate(s){if(!s)return"";let [y,m,d]=s.split("-");return d+"/"+m+"/"+y}
function esc(s){let d=document.createElement("div");d.textContent=s??"";return d.innerHTML}
function money(n){n=Math.round(n||0);return "$"+n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function scoped(){return records.filter(r=>r.empresa===activeCompany)}
function workersCompany(){return workers.filter(w=>w.empresa===activeCompany)}
function activeWorkersCompany(){return workersCompany().filter(w=>w.estado!=="retirado")}
function isAdmin(){return sessionUser&&sessionUser.role==="admin"}
function canAccess(leaf){return leaf==="panel"||isAdmin()||!!(sessionUser&&sessionUser.permissions&&sessionUser.permissions.includes(leaf))}
function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({name:file.name,type:file.type||"application/octet-stream",size:file.size,data:r.result});r.onerror=()=>rej(new Error("No se pudo leer el archivo."));r.readAsDataURL(file)})}
function readFileGeneric(input){return input.files[0]?fileToDataURL(input.files[0]):Promise.resolve(null)}
function docLink(att){
  if(!att)return '<span style="color:var(--ink-soft);font-size:11px">No cargado</span>';
  const isImg=/^image\//.test(att.type), isPdf=att.type==="application/pdf";
  const verBtn=(isImg||isPdf)?`<button class="btn btn-light btn-small" onclick='openFileViewer(${JSON.stringify(att)})'>👁️ Ver</button>`:`<button class="btn btn-light btn-small" onclick="alert('La vista previa no está disponible para este tipo de archivo. Descárgalo para verlo.')">👁️ Ver</button>`;
  return `<span style="display:inline-flex;gap:6px;flex-wrap:wrap">${verBtn}<a class="btn btn-light btn-small" href="${att.data}" download="${esc(att.name)}" target="_blank">⬇️ Descargar</a></span>`;
}
function openFileViewer(att){
  const modal=document.getElementById("file-viewer-modal"), body=document.getElementById("file-viewer-body");
  document.getElementById("file-viewer-title").textContent=att.name;
  if(/^image\//.test(att.type)) body.innerHTML=`<img src="${att.data}" style="max-width:100%;max-height:75vh;display:block;margin:0 auto">`;
  else if(att.type==="application/pdf") body.innerHTML=`<iframe src="${att.data}" style="width:100%;height:75vh;border:0"></iframe>`;
  else body.innerHTML=`<p class="hint">Vista previa no disponible para este tipo de archivo.</p>`;
  document.getElementById("file-viewer-download").href=att.data;
  document.getElementById("file-viewer-download").setAttribute("download",att.name);
  modal.classList.add("open");
}
function closeFileViewer(){ document.getElementById("file-viewer-modal").classList.remove("open"); document.getElementById("file-viewer-body").innerHTML=""; }

function railIcon(cat){ return (cat.label.match(/^\S+/)||["•"])[0]; }
function railLabelText(cat){ return cat.label.replace(/^\S+\s/,""); }
function renderCatNav(){
  const rail=document.getElementById("icon-rail");
  rail.querySelectorAll("button[data-cat]").forEach(b=>b.remove());
  NAV.forEach(c=>{
    const b=document.createElement("button");
    b.dataset.cat=c.id; b.title=railLabelText(c); b.textContent=railIcon(c);
    b.onclick=()=>showCategory(c.id);
    rail.appendChild(b);
  });
}
function applyPermissions(){
  document.querySelectorAll("#icon-rail button[data-cat]").forEach(b=>{
    const cat=NAV.find(c=>c.id===b.dataset.cat);
    const visible=cat.id==="panel"?true:(cat.subs?cat.subs.some(s=>canAccess(s.id)):canAccess(cat.id));
    b.style.display=visible?"flex":"none";
  });
}
function firstAccessibleCategory(){
  for(const c of NAV){ if(c.id==="panel")continue; if(c.subs){ if(c.subs.some(s=>canAccess(s.id))) return c.id } else if(canAccess(c.id)) return c.id }
  return "panel";
}
function showCategory(catId){
  const cat=NAV.find(c=>c.id===catId);
  if(!cat)return;
  document.querySelectorAll("#icon-rail button[data-cat]").forEach(b=>b.classList.toggle("active",b.dataset.cat===catId));
  if(cat.id==="panel"){
    currentCategory="panel"; currentSub="panel";
    document.getElementById("panel-title").textContent="Menú principal";
    document.getElementById("cat-nav").innerHTML=`<button class="panel-item active">${cat.label}</button>`;
    document.getElementById("sub-tabs").classList.add("hidden");
    document.getElementById("company-hero").classList.add("hidden");
    renderSection("panel");
    return;
  }
  if(cat.subs){
    const first=cat.subs.find(s=>canAccess(s.id));
    if(!first)return alert("No tienes permiso para acceder a esta sección.");
    currentCategory=catId;
    renderSidePanel(cat);
    showSub(first.id);
  } else {
    if(!canAccess(cat.id))return alert("No tienes permiso para acceder a esta sección.");
    currentCategory=catId; currentSub=cat.id;
    document.getElementById("panel-title").textContent=railLabelText(cat);
    document.getElementById("cat-nav").innerHTML=`<button class="panel-item active">${cat.label}</button>`;
    document.getElementById("sub-tabs").classList.add("hidden");
    document.getElementById("company-hero").classList.remove("hidden");
    renderSection(cat.id);
  }
}
function renderSidePanel(cat){
  document.getElementById("panel-title").textContent=railLabelText(cat);
  const visibleSubs=cat.subs.filter(s=>canAccess(s.id));
  document.getElementById("cat-nav").innerHTML=visibleSubs.map(s=>`<button class="panel-item" data-sub="${s.id}">${s.label}</button>`).join("");
  document.querySelectorAll("#cat-nav .panel-item").forEach(b=>b.onclick=()=>showSub(b.dataset.sub));
  document.getElementById("sub-tabs").classList.add("hidden");
  document.getElementById("company-hero").classList.remove("hidden");
}
function showSub(subId){
  currentSub=subId;
  document.querySelectorAll("#cat-nav .panel-item").forEach(b=>b.classList.toggle("active",b.dataset.sub===subId));
  renderSection(subId);
}

function showLoginError(msg){
  const e=document.getElementById("login-error");
  e.textContent=msg; e.classList.remove("hidden");
}
async function login(){
  let u=document.getElementById("login-user").value.trim(),p=document.getElementById("login-pass").value;
  if(!u||!p){ showLoginError("Escribe tu usuario y tu contraseña."); return; }
  const btn=document.getElementById("btn-login"); btn.disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:u.toLowerCase()+"@"+AUTH_DOMAIN,password:p});
  btn.disabled=false;
  if(error||!data.user){ showLoginError(error?("Error de Supabase: "+error.message):"Usuario o contraseña incorrectos."); return; }
  await loadAll();
  const uObj=users.find(x=>x.user.toLowerCase()===u.toLowerCase());
  if(!uObj){
    showLoginError("Tu usuario no tiene un perfil configurado en la app. Contacta a un administrador.");
    await sb.auth.signOut();
    return;
  }
  enterApp(uObj);
}
function enterApp(uObj){
  sessionUser=uObj;
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("app").classList.add("visible");
  document.getElementById("tb-avatar-initials").textContent=initials(uObj.name);
  document.getElementById("um-name").textContent=uObj.name;
  document.getElementById("um-cargo").textContent=uObj.cargo||(uObj.role==="admin"?"Administrador":"Usuario");
  document.getElementById("footer-year").textContent=new Date().getFullYear();
  renderCompanySelect();
  renderCatNav();
  applyPermissions();
  renderHero();
  updateBell();
  const first=firstAccessibleCategory();
  showCategory(first);
}
function updateBell(){

  badge.textContent=n; badge.classList.toggle("hidden",n===0);
}

function docChecklistHTML(prefix,oblig,opc,existingDocs){
  existingDocs=existingDocs||{};
  const row=(d,isReq)=>{
    const has=!!(existingDocs[d.id]&&existingDocs[d.id].archivo)|| (prefix==="reg"&&regFormDocs[d.id]) || (prefix==="ret"&&retiroFormDocs[d.id]);
    return `<div class="doc-row">
      <div class="doc-name">${esc(d.label)}${isReq?' <span class="req">*</span>':''}</div>
      <div class="doc-status">${has?'✅':'▫️'}</div>
      <input type="file" class="doc-file" id="${prefix}-doc-${d.id}" data-doc="${d.id}">
      <div>${existingDocs[d.id]&&existingDocs[d.id].archivo?docLink(existingDocs[d.id].archivo):''}</div>
    </div>`;
  };
  return `<div class="notice">Los campos y documentos marcados con <span class="req">*</span> son obligatorios. Puedes registrar apenas estén completos los obligatorios; los demás ayudan a llegar al 100%.</div>
    ${oblig.map(d=>row(d,true)).join("")}
    ${opc.map(d=>row(d,false)).join("")}
    <div class="row"><div class="progress-label" id="${prefix}-progress-label">0% completado</div><div class="progress-wrap"><div class="progress-bar" id="${prefix}-progress-bar" style="width:0%"></div></div></div>`;
}
function computeDocPercent(oblig,opc,existingDocs,formDocs){
  existingDocs=existingDocs||{};formDocs=formDocs||{};
  const all=oblig.concat(opc);
  let filled=0;
  all.forEach(d=>{ if((existingDocs[d.id]&&existingDocs[d.id].archivo)||formDocs[d.id]) filled++ });
  return Math.round(filled/all.length*100);
}
function obligatoriosCompletos(oblig,existingDocs,formDocs){
  existingDocs=existingDocs||{};formDocs=formDocs||{};
  return oblig.every(d=>(existingDocs[d.id]&&existingDocs[d.id].archivo)||formDocs[d.id]);
}

function bindTrabajadorRegistrar(){
  regFormDocs={};regFormFoto=null;
  document.getElementById("reg-foto").onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    const d=await fileToDataURL(f); regFormFoto=d.data;
    document.getElementById("reg-foto-preview").src=d.data; document.getElementById("reg-foto-preview").style.display="block";
    document.getElementById("reg-foto-placeholder").style.display="none";
  };
  DOC_OBLIGATORIOS.concat(DOC_OPCIONALES).forEach(d=>{
    const input=document.getElementById("reg-doc-"+d.id);
    input.onchange=async e=>{
      const f=e.target.files[0]; if(!f){delete regFormDocs[d.id];updateRegProgress();return}
      regFormDocs[d.id]=await fileToDataURL(f);
      updateRegProgress();
      input.closest(".doc-row").querySelector(".doc-status").textContent="✅";
    };
  });
  updateRegProgress();
  document.getElementById("btn-reg-guardar").onclick=saveNewWorker;
}
function updateRegProgress(){
  const pct=computeDocPercent(DOC_OBLIGATORIOS,DOC_OPCIONALES,{},regFormDocs);
  document.getElementById("reg-progress-bar").style.width=pct+"%";
  document.getElementById("reg-progress-label").textContent=pct+"% completado"+(pct<100&&obligatoriosCompletos(DOC_OBLIGATORIOS,{},regFormDocs)?" — obligatorios listos":"");
}
async function saveNewWorker(){
  const err=document.getElementById("reg-err");err.textContent="";
  const nombre=document.getElementById("reg-nombre").value.trim();
  const cedula=document.getElementById("reg-cedula").value.trim();
  const cargo=document.getElementById("reg-cargo").value.trim();
  const edad=document.getElementById("reg-edad").value;
  const hijos=document.getElementById("reg-hijos").value;
  const estudios=document.getElementById("reg-estudios").value.trim();
  const direccion=document.getElementById("reg-direccion").value.trim();
  const salario=document.getElementById("reg-salario").value;
  if(!nombre||!cedula||!cargo){err.textContent="Completa nombre, cédula y cargo.";return}
  if(workers.some(w=>w.cedula===cedula&&w.empresa===activeCompany)){err.textContent="Ya existe un trabajador con esa cédula en "+activeCompany+".";return}
  if(!obligatoriosCompletos(DOC_OBLIGATORIOS,{},regFormDocs)){err.textContent="Debes cargar todos los documentos obligatorios (*) antes de registrar.";return}
  const documentos={};
  DOC_OBLIGATORIOS.concat(DOC_OPCIONALES).forEach(d=>{documentos[d.id]={archivo:regFormDocs[d.id]||null}});
  const extra=readExtraFields("reg");
  const worker={cedula,nombre,empresa:activeCompany,cargo,edad,hijos,estudios,direccion,salario_basico:salario?+salario:0,foto:regFormFoto,documentos,estado:"activo",...extra};
  workers.push(worker); await saveWorkers();
  const pct=computeDocPercent(DOC_OBLIGATORIOS,DOC_OPCIONALES,documentos,{});
  alert(pct===100?"Trabajador registrado con el 100% de la información.":"Trabajador registrado. Los documentos obligatorios están completos, pero la ficha está al "+pct+"%. Puedes completarla luego desde Buscar.");
  renderSection("trabajador-registrar");
}

  const rows=list.map(w=>`<div class="worker-list-item" data-c="${esc(w.cedula)}"><span>${esc(w.nombre)} — ${esc(w.cedula)}${w.estado==="retirado"?' <span class="badge badge-vencido">Retirado</span>':''}</span><span style="font-size:11px;color:var(--ink-soft)">${esc(w.cargo||"")}</span></div>`).join("");
  return `<div class="card">
    <p class="card-title">🔎 Buscar trabajador</p>
    <input id="buscar-input" placeholder="Buscar por nombre o cédula...">
    <div class="row" id="buscar-list">${rows||'<div class="notice">No hay trabajadores registrados en '+esc(activeCompany)+'.</div>'}</div>
  </div>
  <div id="buscar-ficha"></div>`;

function bindTrabajadorBuscar(){
  document.getElementById("buscar-input").oninput=e=>{
    const q=e.target.value.toLowerCase();
    document.querySelectorAll("#buscar-list .worker-list-item").forEach(it=>{
      it.style.display=it.textContent.toLowerCase().includes(q)?"flex":"none";
    });
  };
  document.querySelectorAll("#buscar-list .worker-list-item").forEach(it=>it.onclick=()=>{
    document.querySelectorAll("#buscar-list .worker-list-item").forEach(x=>x.classList.remove("selected"));
    it.classList.add("selected");
    buscarSelected=it.dataset.c;
    fichaMode="ver";
    renderFicha();
  });
  if(buscarSelected&&workersCompany().some(w=>w.cedula===buscarSelected)){
    const it=document.querySelector('#buscar-list .worker-list-item[data-c="'+CSS.escape(buscarSelected)+'"]');
    if(it)it.classList.add("selected");
    renderFicha();
  }
}
let fichaMode="ver";

  const w=workersCompany().find(x=>x.cedula===buscarSelected);

  if(!w){el.innerHTML="";return}
  el.innerHTML=fichaMode==="editar"?fichaEditarHTML(w):fichaResumenHTML(w);

  document.getElementById("btn-ficha-docextra-agregar").onclick=()=>addDocumentoExtra(w.cedula);
}
async function addDocumentoExtra(cedula){
  const w=workers.find(x=>x.cedula===cedula&&x.empresa===activeCompany); if(!w)return;
  const err=document.getElementById("ficha-docextra-err"); err.textContent="";
  const nombre=document.getElementById("ficha-docextra-nombre").value.trim();
  const file=document.getElementById("ficha-docextra-archivo").files[0];
  if(!nombre){err.textContent="Indica el nombre del documento.";return}
  if(!file){err.textContent="Selecciona un archivo.";return}
  const archivo=await fileToDataURL(file);
  if(!w.documentosExtra) w.documentosExtra=[];
  w.documentosExtra.push({id:Date.now()+"",nombre,archivo});
  await saveWorkers();
  renderFicha();
}
async function removeDocumentoExtra(cedula,id){
  const w=workers.find(x=>x.cedula===cedula&&x.empresa===activeCompany); if(!w)return;
  if(!confirm("¿Eliminar este documento?"))return;
  w.documentosExtra=(w.documentosExtra||[]).filter(d=>d.id!==id);
  await saveWorkers();
  renderFicha();
}

function bindFichaEditar(w){
  document.getElementById("fi-foto").onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    const d=await fileToDataURL(f);
    w.foto=d.data; await saveWorkers();
    document.getElementById("fi-foto-preview").src=d.data; document.getElementById("fi-foto-preview").style.display="block";
    document.getElementById("fi-foto-placeholder").style.display="none";
  };
  DOC_OBLIGATORIOS.concat(DOC_OPCIONALES).forEach(d=>{
    document.getElementById("fi-doc-"+d.id).onchange=async e=>{
      const f=e.target.files[0]; if(!f)return;
      const att=await fileToDataURL(f);
      if(!w.documentos)w.documentos={};
      w.documentos[d.id]={archivo:att};
      await saveWorkers();
      document.getElementById("fi-status-"+d.id).textContent="✅";
      document.getElementById("fi-link-"+d.id).innerHTML=docLink(att);
      const newPct=computeDocPercent(DOC_OBLIGATORIOS,DOC_OPCIONALES,w.documentos,{});
      document.getElementById("fi-progress-bar").style.width=newPct+"%";
    };
  });
  document.getElementById("btn-fi-guardar").onclick=()=>saveFichaEdits(w.cedula);
  document.getElementById("btn-fi-cancelar").onclick=()=>{ fichaMode="ver"; renderFicha(); };
}
async function saveFichaEdits(cedula){
  const w=workers.find(x=>x.cedula===cedula&&x.empresa===activeCompany); if(!w)return;
  w.nombre=document.getElementById("fi-nombre").value.trim()||w.nombre;
  w.cargo=document.getElementById("fi-cargo").value.trim();
  w.edad=document.getElementById("fi-edad").value;
  w.hijos=document.getElementById("fi-hijos").value;
  w.estudios=document.getElementById("fi-estudios").value.trim();
  w.direccion=document.getElementById("fi-direccion").value.trim();
  w.salario_basico=+document.getElementById("fi-salario").value||0;
  Object.assign(w,readExtraFields("fi"));
  await saveWorkers();
  fichaMode="ver";
  renderSection("trabajador-buscar");
}
async function deleteWorkerFicha(cedula){
  if(records.some(r=>r.empresa===activeCompany&&r.cedula===cedula)) return alert("No se puede eliminar: este trabajador tiene registros de ausencias asociados.");
  if(!confirm("¿Eliminar este trabajador definitivamente?"))return;
  workers=workers.filter(x=>!(x.cedula===cedula&&x.empresa===activeCompany));
  await saveWorkers(); buscarSelected=null; renderSection("trabajador-buscar");
}

function trabajadorRetirarHTML(){
  const list=activeWorkersCompany().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  return `<div class="card">
    <p class="card-title">🚪 Retirar trabajador</p>
    <p class="hint">Selecciona un trabajador activo y carga los documentos requisito del retiro.</p>
    <label class="field">Trabajador</label>
    <select id="ret-trabajador"><option value="">Seleccione un trabajador</option>${list.map(w=>`<option value="${esc(w.cedula)}">${esc(w.nombre)} — ${esc(w.cedula)}</option>`).join("")}</select>
    <div class="row"><label class="field">Fecha de retiro</label><input type="date" id="ret-fecha" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="row">${docChecklistHTML("ret",RETIRO_OBLIGATORIOS,RETIRO_OPCIONALES,{})}</div>
    <div class="err" id="ret-err"></div>
    <div class="actions"><button class="btn btn-danger" id="btn-ret-guardar">Retirar trabajador</button></div>
  </div>`;
}
function bindTrabajadorRetirar(){
  retiroFormDocs={};
  RETIRO_OBLIGATORIOS.concat(RETIRO_OPCIONALES).forEach(d=>{
    const input=document.getElementById("ret-doc-"+d.id);
    input.onchange=async e=>{
      const f=e.target.files[0]; if(!f){delete retiroFormDocs[d.id];updateRetProgress();return}
      retiroFormDocs[d.id]=await fileToDataURL(f);
      updateRetProgress();
      input.closest(".doc-row").querySelector(".doc-status").textContent="✅";
    };
  });
  updateRetProgress();
  document.getElementById("btn-ret-guardar").onclick=confirmRetiro;
}
function updateRetProgress(){
  const pct=computeDocPercent(RETIRO_OBLIGATORIOS,RETIRO_OPCIONALES,{},retiroFormDocs);
  document.getElementById("ret-progress-bar").style.width=pct+"%";
  document.getElementById("ret-progress-label").textContent=pct+"% completado";
}
async function confirmRetiro(){
  const err=document.getElementById("ret-err");err.textContent="";
  const cedula=document.getElementById("ret-trabajador").value;
  const fecha=document.getElementById("ret-fecha").value;
  const w=workers.find(x=>x.cedula===cedula&&x.empresa===activeCompany);
  if(!w){err.textContent="Selecciona un trabajador.";return}
  if(!fecha){err.textContent="Indica la fecha de retiro.";return}
  if(!obligatoriosCompletos(RETIRO_OBLIGATORIOS,{},retiroFormDocs)){err.textContent="Carga el documento obligatorio (*) para poder retirar al trabajador.";return}
  if(!confirm("¿Confirmas el retiro de "+w.nombre+"?"))return;
  const documentos={};
  RETIRO_OBLIGATORIOS.concat(RETIRO_OPCIONALES).forEach(d=>{documentos[d.id]={archivo:retiroFormDocs[d.id]||null}});
  w.estado="retirado"; w.retiro={fecha,documentos};
  await saveWorkers();
  alert("Trabajador retirado correctamente.");
  renderSection("trabajador-retirar");
}

function bindGenerarDoc(){
  const setTemplate=()=>{
    const v=document.getElementById("gen-plantilla").value;
    if(!v)return;
    if(v.startsWith("custom:")){
      const t=customTemplates.find(x=>x.id===v.slice(7));
      document.getElementById("gen-texto").value=t?t.texto:"";
    } else {
      document.getElementById("gen-texto").value=DOC_TEMPLATES[v.slice(5)]||"";
    }
  };
  document.getElementById("gen-plantilla").onchange=setTemplate; setTemplate();
  document.getElementById("gen-trabajador").onchange=e=>genSelected=e.target.value;
  document.getElementById("btn-gen-generar").onclick=generarDocumento;
  document.getElementById("btn-gen-imprimir").onclick=()=>window.print();
  document.getElementById("btn-tpl-guardar").onclick=saveCustomTemplate;
  renderTplList();

async function saveCustomTemplate(){
  const err=document.getElementById("tpl-err");err.textContent="";
  const nombre=document.getElementById("tpl-nombre").value.trim();
  const file=document.getElementById("tpl-archivo").files[0];
  if(!nombre||!file){err.textContent="Dale un nombre a la plantilla y elige un archivo.";return}
  let texto="";
  try{
    if(file.name.toLowerCase().endsWith(".docx")){
      const buf=await file.arrayBuffer();
      const result=await mammoth.extractRawText({arrayBuffer:buf});
      texto=result.value;
    } else {
      texto=await file.text();
    }
  }catch(e){ console.error(e); err.textContent="No se pudo leer el archivo. Prueba con un .docx o .txt."; return; }
  if(!texto.trim()){err.textContent="El archivo parece estar vacío.";return}
  customTemplates.push({id:Date.now()+"",nombre,texto});
  await saveCustomTemplates();
  alert("Plantilla guardada. Ya aparece en el selector de plantillas.");
  renderSection("trabajador-generardoc");
}
function renderTplList(){
  const el=document.getElementById("tpl-list");
  if(!customTemplates.length){el.innerHTML="";return}
  el.innerHTML='<p class="card-title" style="font-size:12px;margin-top:14px">Tus plantillas guardadas</p>'+customTemplates.map(t=>`<div class="worker-list-item"><span>⭐ ${esc(t.nombre)}</span><button class="btn btn-danger btn-small" onclick="removeCustomTemplate('${t.id}')">Eliminar</button></div>`).join("");
}
async function removeCustomTemplate(id){
  if(!confirm("¿Eliminar esta plantilla?"))return;
  customTemplates=customTemplates.filter(t=>t.id!==id);
  await saveCustomTemplates();
  renderSection("trabajador-generardoc");
}
function generarDocumento(){
  const w=workersCompany().find(x=>x.cedula===genSelected);
  let text=document.getElementById("gen-texto").value;
  const checked=[...document.querySelectorAll(".gen-check:checked")].map(c=>c.value);

}

async function addAusencia(cat){
  const err=document.getElementById("au-err");err.textContent="";
  const inicio=document.getElementById("au-inicio").value, fin=document.getElementById("au-fin").value;
  const observacion=document.getElementById("au-observacion").value.trim();
  const file=document.getElementById("au-archivo").files[0];
  const entidad=cat==="Incapacidades"?document.getElementById("au-entidad").value:null;
  const tipoLicencia=cat==="Licencia"?document.getElementById("au-tipolicencia").value:null;
  const descuentaDia=(cat==="Licencia"||cat==="Día no laboral")?(document.getElementById("au-descuenta").value==="si"):null;
  if(!inicio||!fin){err.textContent="Completa las fechas.";return}
  if(fin<inicio){err.textContent="La fecha de fin no puede ser anterior a la de inicio.";return}
  if(file&&file.size>5*1024*1024){err.textContent="El archivo supera los 5 MB.";return}
  const attachment=file?await fileToDataURL(file):null;
  let targets=[];
  if(cat==="Día no laboral"){
    if(!observacion){err.textContent="Indica el motivo del día no laboral.";return}
    if(document.getElementById("au-todos").checked){
      targets=[{cedula:"__TODOS__",nombre:"Toda la empresa",cargo:""}];
    } else {
      const selected=[...document.getElementById("au-trabajadores-multi").selectedOptions].map(o=>o.value);
      if(!selected.length){err.textContent="Selecciona al menos un trabajador, o marca 'Aplicar a todos'.";return}
      targets=selected.map(c=>{const w=workersCompany().find(x=>x.cedula===c);return {cedula:w.cedula,nombre:w.nombre,cargo:w.cargo}});
    }
  } else {
    const cedula=document.getElementById("au-trabajador").value;
    const w=workersCompany().find(x=>x.cedula===cedula);
    if(!w){err.textContent="Selecciona un trabajador.";return}
    targets=[{cedula:w.cedula,nombre:w.nombre,cargo:w.cargo}];
  }
  targets.forEach(t=>{
    records.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,8),nombre:t.nombre,cedula:t.cedula,empresa:activeCompany,cargo:t.cargo,categoria:cat,entidad,tipoLicencia,descuentaDia,inicio,fin,dias:daysBetween(inicio,fin),observacion,attachment,origen:"manual"});
  });
  await saveRecords();
  renderSection("ausencias-"+cat);
}

function renderAusenciasList(cat){
  const data=scoped().filter(r=>r.categoria===cat), susp=cat==="Suspensión", isLicencia=cat==="Licencia", showDescuenta=cat==="Licencia"||cat==="Día no laboral";
  let rows=data.length?'<div class="table-wrap table-grid"><table><thead><tr><th>Trabajador</th><th>Cédula</th><th>Cargo</th>'+(cat==="Incapacidades"?"<th>Entidad</th>":"")+(isLicencia?"<th>Tipo</th>":"")+(showDescuenta?"<th>Descuenta</th>":"")+'<th>Inicio</th><th>Fin</th><th>Días</th><th>'+(cat==="Día no laboral"?"Motivo":"Observación")+'</th><th>Origen</th><th>Archivo</th><th></th></tr></thead><tbody>':'<div class="notice">No hay registros en esta categoría para '+esc(activeCompany)+'.</div>';
  data.forEach(r=>{
    const count=records.filter(x=>x.empresa===activeCompany&&x.cedula===r.cedula&&x.categoria==="Suspensión").length;
    const danger=susp&&count>=2;
    const obs=r.observacion?esc(r.observacion):"—";

const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const AUX_TRANSPORTE_MENSUAL=249095;
function periodRange(year,month,quincena){
  const lastDay=new Date(year,month+1,0).getDate();
  if(quincena===1) return {start:new Date(year,month,1),end:new Date(year,month,15),totalDias:15};
  return {start:new Date(year,month,16),end:new Date(year,month,lastDay),totalDias:lastDay-15};
}
function toISO(d){return d.toISOString().slice(0,10)}
function dayWeight(cedula,dateISO){
  const recs=scoped().filter(r=>(r.cedula===cedula||r.cedula==="__TODOS__")&&r.inicio<=dateISO&&r.fin>=dateISO);
  if(!recs.length)return 1;
  let w=1;
  recs.forEach(r=>{
    let rw=1;
    if(r.categoria==="Faltas injustificadas"||r.categoria==="Suspensión"||r.categoria==="Permisos no remunerados") rw=0;
    else if(r.categoria==="Incapacidades") rw=r.entidad==="ARL"?1:0.66;
    else if(r.categoria==="Licencia") rw=r.descuentaDia?0:1;
    else if(r.categoria==="Día no laboral") rw=r.descuentaDia?0:1;
    if(rw<w) w=rw;
  });
  return w;
}
const CARGO_PASTEL_PALETTE=["#ffd6d6","#ffe3c2","#fff6c2","#e3f3c2","#c9f0d6","#c2f0e6","#c2e8f7","#c2d6f7","#d8c9f7","#f0c2f0","#f7c2dd","#f2c9c9","#e6ddc2","#d3e6c2","#c2e6e0","#dcd6f7","#f7ddc2","#c9e0f7"];
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h)}
function cargoKey(cargo){return (cargo||"Sin cargo").trim().toLowerCase()}
function cargoColor(cargo){
  const key=cargoKey(cargo);
  if(cargoColors[key]) return cargoColors[key];
  return CARGO_PASTEL_PALETTE[hashStr(key)%CARGO_PASTEL_PALETTE.length];
}
async function setCargoColor(cargo,color){
  cargoColors[cargoKey(cargo)]=color;
  await saveCargoColors();
  renderNominaTable();
}
async function resetCargoColor(cargo){
  delete cargoColors[cargoKey(cargo)];
  await saveCargoColors();
  renderNominaTable();
}
function orderedWorkersList(list){
  const order=nominaOrder[activeCompany]||[];
  const idx=new Map(order.map((c,i)=>[c,i]));
  return list.slice().sort((a,b)=>{
    const ia=idx.has(a.cedula)?idx.get(a.cedula):Infinity;
    const ib=idx.has(b.cedula)?idx.get(b.cedula):Infinity;
    if(ia!==ib) return ia-ib;
    return a.nombre.localeCompare(b.nombre,'es');
  });
}
async function moveWorkerNomina(cedula,dir){
  const {start,end}=periodRange(nomYear,nomMonth,nomQuincena);
  const startISO=toISO(start);
  const base=workersCompany().filter(w=>w.estado!=="retirado"|| (w.retiro&&w.retiro.fecha>=startISO));
  const ordered=orderedWorkersList(base);
  const i=ordered.findIndex(w=>w.cedula===cedula);
  const j=i+dir;
  if(i<0||j<0||j>=ordered.length) return;
  [ordered[i],ordered[j]]=[ordered[j],ordered[i]];
  nominaOrder[activeCompany]=ordered.map(w=>w.cedula);
  await saveNominaOrder();
  renderNominaTable();
}
function renderNominaPrintHeader(start,end){
  const logo=logos[activeCompany];
  const img=document.getElementById("nom-print-logo");

  document.getElementById("nom-print-periodo").textContent=
    `NÓMINA DEL ${start.getDate()} AL ${end.getDate()} DE ${MESES[nomMonth].toUpperCase()} DE ${nomYear}`;
}
function nominaPeriodKey(){return activeCompany+"|"+nomYear+"-"+nomMonth+"-"+nomQuincena}
function nominaManualFor(cedula){
  const key=nominaPeriodKey();
  if(!nominaManual[key])nominaManual[key]={};
  if(!nominaManual[key][cedula])nominaManual[key][cedula]={dominical:0,recargo:0,descuentos:0,dominicalLocked:false,recargoLocked:false};
  if(nominaManual[key][cedula].dominicalLocked===undefined) nominaManual[key][cedula].dominicalLocked=false;
  if(nominaManual[key][cedula].recargoLocked===undefined) nominaManual[key][cedula].recargoLocked=false;
  return nominaManual[key][cedula];
}
/* Valor por hora de recargo nocturno */
const RECARGO_VALOR_HORA=2918;
/* Celda reutilizable: valor manual que, una vez guardado, queda bloqueado.
   Solo un administrador puede desbloquearlo y volver a editarlo. */
function manualLockCellHTML(cedula,manual,field,admin,defaultVal){
  if(manual[field+"Locked"]){
    return `<span class="lock-cell"><strong>${money(manual[field]||0)}</strong><span class="no-print" title="Bloqueado" style="font-size:12px">🔒</span>${admin?`<button class="btn-order no-print" title="Desbloquear" onclick="unlockManual('${esc(cedula)}','${field}')" style="font-size:10px">🔓</button>`:""}</span>`;
  }

  return `<span class="lock-cell"><input type="number" min="0" value="${manual[field]||defaultVal||0}" data-cedula="${esc(cedula)}" data-field="${field}" class="nom-manual" style="width:80px"><button class="btn-order no-print" title="Guardar y bloquear" onclick="lockManual('${esc(cedula)}','${field}')" style="font-size:10px">🔒</button></span>`;
}
async function lockManual(cedula,field){
  if(!isAdmin())return;
  const inp=[...document.querySelectorAll(".nom-manual")].find(i=>i.dataset.cedula===cedula&&i.dataset.field===field);
  const m=nominaManualFor(cedula);

  m[field+"Locked"]=true;
  await saveNominaManual();
  renderSection(currentSub);
}
async function unlockManual(cedula,field){
  if(!isAdmin())return;
  if(!confirm("¿Desbloquear este valor para poder editarlo? Solo un administrador puede hacer esto."))return;
  const m=nominaManualFor(cedula);
  m[field+"Locked"]=false;
  await saveNominaManual();
  renderSection(currentSub);
}
function festivosCompany(){
  if(!festivos[activeCompany]) festivos[activeCompany]={};
  return festivos[activeCompany];
}
function festivosCountForWorker(cedula,startISO,endISO){
  const fc=festivosCompany();
  let count=0;
  Object.keys(fc).forEach(dISO=>{
    if(dISO>=startISO&&dISO<=endISO&&(fc[dISO]||[]).includes(cedula)) count++;
  });
  return count;
}

function renderNominaTable(){
  const {start,end,totalDias}=periodRange(nomYear,nomMonth,nomQuincena);
  const startISO=toISO(start), endISO=toISO(end);
  renderNominaPrintHeader(start,end);
  const listBase=workersCompany().filter(w=>w.estado!=="retirado"|| (w.retiro&&w.retiro.fecha>=startISO));
  const list=orderedWorkersList(listBase);
  renderCargoLegend(list);
  let totales={dominical:0,recargo:0,devengado:0,eps:0,afp:0,descuentos:0,deducciones:0,neto:0};
  const admin=isAdmin();
  const notas=[];
  let rows="";
  list.forEach((w,i)=>{
    let suma=0;
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){ suma+=dayWeight(w.cedula,toISO(d)); }
    const frac=suma/totalDias;
    const salarioMensual=w.salario_basico||0;
    const sueldoVerde=(salarioMensual/2)*frac;
    const auxTransporte=(AUX_TRANSPORTE_MENSUAL/2)*frac;
    const manual=nominaManualFor(w.cedula);
    const festivoValor=Math.round((w.valorFestivo||0)*festivosCountForWorker(w.cedula,startISO,endISO));
    const totalDevengado=sueldoVerde+auxTransporte+festivoValor+(+manual.recargo||0);
    const aporteEPS=sueldoVerde*0.04, aporteAFP=sueldoVerde*0.04;
    const totalDeducciones=aporteEPS+aporteAFP+(+manual.descuentos||0);
    const neto=totalDevengado-totalDeducciones;
    totales.dominical+=festivoValor;totales.recargo+=(+manual.recargo||0);
    totales.devengado+=totalDevengado;totales.eps+=aporteEPS;totales.afp+=aporteAFP;totales.descuentos+=(+manual.descuentos||0);totales.deducciones+=totalDeducciones;totales.neto+=neto;
    const diasTxt=Math.round(suma).toString();
    rows+=`<tr>
      <td>${i+1}</td>
      <td class="nom-order-cell no-print">
        <button class="btn-order" onclick="moveWorkerNomina('${esc(w.cedula)}',-1)" ${i===0?"disabled":""} title="Subir">▲</button>
        <button class="btn-order" onclick="moveWorkerNomina('${esc(w.cedula)}',1)" ${i===list.length-1?"disabled":""} title="Bajar">▼</button>
      </td>
      <td>${esc(w.nombre)}</td>
      <td>${esc(w.cedula)}</td>
      <td><span class="cargo-pill" style="background:${cargoColor(w.cargo)}">${esc(w.cargo&&w.cargo.trim()?w.cargo:"Sin cargo")}</span></td>
      <td class="num">${money(salarioMensual)}</td>
      <td class="num">${diasTxt}</td>
      <td class="num">${money(sueldoVerde)}</td>
      <td class="num">${money(auxTransporte)}</td>
      <td class="num">${festivoValor?money(festivoValor):`<span class="hint" style="margin:0">${money(0)}</span>`}</td>
      <td class="num">${manualLockCellHTML(w.cedula,manual,"recargo",admin)}</td>
      <td class="num"><strong>${money(totalDevengado)}</strong></td>
      <td class="num">${money(aporteEPS)}</td>
      <td class="num">${money(aporteAFP)}</td>
      <td class="num"><input type="number" min="0" value="${manual.descuentos||0}" data-cedula="${esc(w.cedula)}" data-field="descuentos" class="nom-manual text-red" style="width:80px"></td>
      <td class="num text-red"><strong>${money(totalDeducciones)}</strong></td>
      <td class="num"><strong>${money(neto)}</strong></td>
      <td></td>
    </tr>`;
    const notasWorker=scoped().filter(r=>r.cedula===w.cedula&&r.inicio<=endISO&&r.fin>=startISO);
    notasWorker.forEach(r=>{
      notas.push({fecha:r.inicio,html:`<strong>${esc(w.nombre)}:</strong> ${esc(CAT_LABEL[r.categoria]||r.categoria)} del ${fmtDate(r.inicio)} al ${fmtDate(r.fin)}${r.entidad?" ("+r.entidad+")":""}${r.categoria==="Licencia"&&r.tipoLicencia?" — "+esc(r.tipoLicencia):""}${(r.categoria==="Licencia"||r.categoria==="Día no laboral")?(r.descuentaDia?" (descuenta el día)":" (no descuenta)"):""}${r.observacion?" — "+esc(r.observacion):""}`});
    });
  });
  document.getElementById("nom-table-wrap").innerHTML=`<table><thead><tr><th>No.</th><th class="no-print">Orden</th><th>Nombre</th><th>Cédula</th><th>Cargo</th><th>Sueldo básico</th><th>Días lab.</th><th>Sueldo devengado</th><th>Aux. transporte</th><th>Dominical/Festivo</th><th>Recargo</th><th>Total devengado</th><th>Aporte EPS</th><th>Aporte AFP</th><th>Descuentos</th><th>Total deducciones</th><th>Neto a pagar</th><th>Recibe conforme</th></tr></thead><tbody>
    ${rows||'<tr><td colspan="18" style="text-align:center;color:var(--ink-soft)">No hay trabajadores activos en '+esc(activeCompany)+'.</td></tr>'}
    </tbody><tfoot><tr><td colspan="9" style="text-align:right;font-weight:800">TOTALES</td><td class="num" style="font-weight:800">${money(totales.dominical)}</td><td class="num" style="font-weight:800">${money(totales.recargo)}</td><td class="num" style="font-weight:800">${money(totales.devengado)}</td><td class="num" style="font-weight:800">${money(totales.eps)}</td><td class="num" style="font-weight:800">${money(totales.afp)}</td><td class="num text-red" style="font-weight:800">${money(totales.descuentos)}</td><td class="num text-red" style="font-weight:800">${money(totales.deducciones)}</td><td class="num" style="font-weight:800">${money(totales.neto)}</td><td></td></tr></tfoot></table>`;
  const noLaboral=scoped().filter(r=>r.categoria==="Día no laboral"&&r.cedula==="__TODOS__"&&r.inicio<=endISO&&r.fin>=startISO);
  const notasGenerales=noLaboral.map(r=>`Del ${fmtDate(r.inicio)} al ${fmtDate(r.fin)}${r.descuentaDia?" (descuenta el día)":" (no descuenta)"}${r.observacion?" — "+esc(r.observacion):""}`);
  notas.sort((a,b)=>a.fecha.localeCompare(b.fecha));

  document.querySelectorAll(".nom-manual").forEach(inp=>inp.onchange=async e=>{
    const m=nominaManualFor(e.target.dataset.cedula);
    m[e.target.dataset.field]=+e.target.value||0;
    await saveNominaManual(); renderNominaTable();
  });
}

function renderNominaCalendarTable(){
  const {start,end}=periodRange(nomYear,nomMonth,nomQuincena);

  const list=orderedWorkersList(workersCompany().filter(w=>w.estado!=="retirado"|| (w.retiro&&w.retiro.fecha>=startISO)));

  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) days.push(toISO(d));

/* ===================== NÓMINA: RECARGO (calculadora + valor bloqueado) ===================== */
function horasRecargoDesdeEntrada(horaStr){
  if(!horaStr) return 0;
  const partes=horaStr.split(":");
  const hh=+partes[0], mm=+(partes[1]||0);
  if(isNaN(hh)) return 0;
  const entrada=hh+mm/60;
  let horas;
  if(entrada<6) horas=6-entrada;
  else if(entrada===6) horas=0;
  else horas=(24-entrada)+6;
  return Math.round(horas*100)/100;
}
function recargoCalcFor(cedula){
  const key=nominaPeriodKey();
  if(!recargoCalc[key])recargoCalc[key]={};
  if(!recargoCalc[key][cedula])recargoCalc[key][cedula]={modo:"fijo",hora:"",dias:0,porDia:{}};
  const rc=recargoCalc[key][cedula];
  if(!rc.modo) rc.modo="fijo";
  if(!rc.porDia) rc.porDia={};
  return rc;
}
function periodDaysISO(){
  const {start,end}=periodRange(nomYear,nomMonth,nomQuincena);
  const days=[];
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) days.push(toISO(d));
  return days;
}
function nominaRecargoHTML(){
  const years=[...new Set([nomYear,new Date().getFullYear(),new Date().getFullYear()-1])].sort((a,b)=>b-a);
  return `<div class="card no-print">
    <p class="card-title">🌙 Recargo nocturno — calculadora por trabajador</p>
    <p class="hint">Para cada trabajador elige si su horario es <strong>Fijo</strong> (entra a la misma hora todos los días que trabajó) o <strong>Variable</strong> (la hora cambia de un día a otro). El sistema calcula las horas antes de las 6:00 a.m. y las multiplica por ${money(RECARGO_VALOR_HORA)} por hora, como valor de referencia. Tú escribes el valor final en "Valor a registrar" y lo guardas; una vez guardado queda bloqueado y solo un administrador puede desbloquearlo.</p>
    <div class="report-controls">
      <div><label class="field">Año</label><select id="rec-year">${years.map(y=>`<option ${y===nomYear?"selected":""}>${y}</option>`).join("")}</select></div>
      <div><label class="field">Mes</label><select id="rec-month">${MESES.map((m,i)=>`<option value="${i}" ${i===nomMonth?"selected":""}>${m}</option>`).join("")}</select></div>
      <div><label class="field">Quincena</label><select id="rec-quincena"><option value="1" ${nomQuincena===1?"selected":""}>1 (día 1 al 15)</option><option value="2" ${nomQuincena===2?"selected":""}>2 (día 16 al fin de mes)</option></select></div>
    </div>
  </div>
  <div class="card"><div class="table-wrap" id="rec-table-wrap"></div></div>`;
}
function bindNominaRecargo(){
  document.getElementById("rec-year").onchange=e=>{nomYear=+e.target.value;renderRecargoTable()};
  document.getElementById("rec-month").onchange=e=>{nomMonth=+e.target.value;renderRecargoTable()};
  document.getElementById("rec-quincena").onchange=e=>{nomQuincena=+e.target.value;renderRecargoTable()};
  renderRecargoTable();
}
function renderRecargoTable(){
  const {start}=periodRange(nomYear,nomMonth,nomQuincena);
  const startISO=toISO(start);
  const list=orderedWorkersList(workersCompany().filter(w=>w.estado!=="retirado"|| (w.retiro&&w.retiro.fecha>=startISO)));
  const admin=isAdmin();
  const days=periodDaysISO();
  const rows=list.map(w=>{
    const rc=recargoCalcFor(w.cedula);
    const m=nominaManualFor(w.cedula);
    const esVariable=rc.modo==="variable";
    let horasCol,diasCol,horasDiaCol,sugerido;
    if(esVariable){
      const diasConfigurados=days.filter(d=>rc.porDia[d]).length;
      const totalHoras=days.reduce((acc,d)=>acc+(rc.porDia[d]?horasRecargoDesdeEntrada(rc.porDia[d]):0),0);
      sugerido=Math.round(totalHoras*RECARGO_VALOR_HORA);
      horasCol=`<span class="hint" style="margin:0">Ver detalle abajo ⬇</span>`;
      diasCol=`${diasConfigurados} día(s)`;
      horasDiaCol=`${Math.round(totalHoras*100)/100} h total`;
    } else {
      const horasDia=horasRecargoDesdeEntrada(rc.hora);
      sugerido=Math.round(horasDia*(rc.dias||0)*RECARGO_VALOR_HORA);
      horasCol=admin?`<input type="time" value="${esc(rc.hora||"")}" onchange="setRecargoHora('${esc(w.cedula)}',this.value)" style="width:110px">`:esc(rc.hora||"—");
      diasCol=admin?`<input type="number" min="0" value="${rc.dias||0}" onchange="setRecargoDias('${esc(w.cedula)}',this.value)" style="width:70px">`:(rc.dias||0);
      horasDiaCol=horasDia?horasDia+" h":"—";
    }
    const modoSelect=admin?`<select onchange="setRecargoModo('${esc(w.cedula)}',this.value)" style="font-size:11px"><option value="fijo" ${!esVariable?"selected":""}>Fijo</option><option value="variable" ${esVariable?"selected":""}>Variable</option></select>`:(esVariable?"Variable":"Fijo");
    const detailRow=esVariable?`<tr class="no-print"><td></td><td colspan="6" style="background:var(--paper)">
        <p class="hint" style="margin:0 0 8px">Escribe la hora de entrada solo en los días que ${esc(w.nombre)} trabajó; deja vacío el resto.</p>
        <div class="per-day-grid">${days.map(d=>{
          const dayNum=+d.slice(8,10);
          return `<label style="font-size:10.5px;font-weight:700;color:var(--ink-soft)">${dayNum}<input type="time" ${admin?"":"disabled"} value="${esc(rc.porDia[d]||"")}" onchange="setRecargoDiaHora('${esc(w.cedula)}','${d}',this.value)" style="width:100%;margin-top:2px"></label>`;
        }).join("")}</div>
      </td></tr>`:"";
    return `<tr>
      <td>${esc(w.nombre)}</td>
      <td>${esc(w.cedula)}</td>
      <td>${modoSelect}</td>
      <td>${horasCol}</td>
      <td class="num">${diasCol}</td>
      <td class="num">${horasDiaCol}</td>
      <td class="num">${money(sugerido)}</td>
      <td class="num">${manualLockCellHTML(w.cedula,m,"recargo",admin,sugerido)}</td>
    </tr>${detailRow}`;
  }).join("");
  document.getElementById("rec-table-wrap").innerHTML=`<table><thead><tr><th>Nombre</th><th>Cédula</th><th>Horario</th><th>Hora de entrada</th><th>Días trabajados</th><th>Horas recargo/día</th><th>Valor sugerido</th><th>Valor a registrar (Recargo)</th></tr></thead><tbody>
    ${rows||'<tr><td colspan="8" style="text-align:center;color:var(--ink-soft)">No hay trabajadores activos en '+esc(activeCompany)+'.</td></tr>'}
  </tbody></table>`;
}

  if(!isAdmin())return;
  const rc=recargoCalcFor(cedula);
  rc.modo=modo;
  await saveRecargoCalc();

function docEstado(doc){
  if(!doc.fechaVencimiento) return {badge:"",cls:""};
  const hoy=new Date().toISOString().slice(0,10);
  const dias=Math.round((new Date(doc.fechaVencimiento+"T00:00:00")-new Date(hoy+"T00:00:00"))/86400000);
  if(dias<0) return {badge:"Vencido",cls:"badge-vencido"};
  if(doc.notificar&&dias<=30) return {badge:"Vence en "+dias+" día(s)",cls:"badge-warn"};
  return {badge:"Vigente",cls:"badge-ok"};
}

async function downloadComiteImage(elId,label,isGroup){
  const el=document.getElementById(isGroup?elId:"comite-card-"+elId);
  if(!el||typeof html2canvas==="undefined"){alert("No se pudo generar la imagen. Verifica tu conexión a internet e inténtalo de nuevo.");return}
  const hidden=el.querySelectorAll(".no-shot");
  hidden.forEach(h=>h.style.display="none");
  try{
    const canvas=await html2canvas(el,{backgroundColor:"#ffffff",scale:2});
    const link=document.createElement("a");
    link.download=(isGroup?label:("Comite_"+label+"_"+activeCompany)).replace(/[^a-zA-Z0-9_\-]/g,"_")+".png";
    link.href=canvas.toDataURL("image/png");
    link.click();
  }catch(e){
    alert("No se pudo generar la imagen: "+e.message);
  }finally{
    hidden.forEach(h=>h.style.display="");
  }
}

/* ===================== SST: PRESUPUESTO ===================== */
const MESES_CORTOS=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
let presYear=new Date().getFullYear();
function presCompany(){
  if(!presupuesto[activeCompany]) presupuesto[activeCompany]={conceptos:[{id:"uniformes",nombre:"Uniformes y dotación"}],data:{}};
  if(!presupuesto[activeCompany].conceptos) presupuesto[activeCompany].conceptos=[{id:"uniformes",nombre:"Uniformes y dotación"}];
  if(!presupuesto[activeCompany].data) presupuesto[activeCompany].data={};
  return presupuesto[activeCompany];
}
function presYearData(year){
  const pc=presCompany();
  if(!pc.data[year]) pc.data[year]={};
  pc.conceptos.forEach(cn=>{ if(!pc.data[year][cn.id]) pc.data[year][cn.id]=Array.from({length:12},()=>({presupuestado:0,ejecutado:0})); });
  return pc.data[year];
}
function presupuestoHTML(){
  const years=[...new Set([presYear,new Date().getFullYear(),new Date().getFullYear()-1,new Date().getFullYear()+1])].sort((a,b)=>b-a);
  return `<div class="card">
    <p class="card-title">💰 Presupuesto — ${esc(activeCompany)}</p>
    <p class="hint">Presupuesto de uniformes y demás conceptos de SST: compara lo presupuestado contra lo ejecutado, mes a mes.</p>
    <div class="report-controls">
      <div><label class="field">Año</label><select id="pres-year">${years.map(y=>`<option ${y===presYear?"selected":""}>${y}</option>`).join("")}</select></div>
      <div style="display:flex;align-items:end;gap:8px">
        <input id="pres-nuevo-concepto" placeholder="Nombre del nuevo concepto (ej: Uniformes)" style="min-width:220px">
        <button class="btn btn-light" id="btn-pres-agregar-concepto">➕ Agregar concepto</button>
      </div>
    </div>
    <div class="table-wrap" id="pres-table-wrap"></div>
  </div>`;
}
function bindPresupuesto(){
  document.getElementById("pres-year").onchange=e=>{presYear=+e.target.value;renderPresupuestoTable()};
  document.getElementById("btn-pres-agregar-concepto").onclick=async()=>{
    const inp=document.getElementById("pres-nuevo-concepto");
    const nombre=inp.value.trim();
    if(!nombre) return;
    const pc=presCompany();
    pc.conceptos.push({id:"c"+Date.now(),nombre});
    await savePresupuesto();
    renderPresupuestoTable();
  };
  renderPresupuestoTable();
}
async function removePresupuestoConcepto(id){
  if(!confirm("¿Eliminar este concepto de presupuesto? Se perderán sus valores registrados."))return;
  const pc=presCompany();
  pc.conceptos=pc.conceptos.filter(c=>c.id!==id);
  Object.values(pc.data).forEach(yearData=>{ delete yearData[id]; });
  await savePresupuesto();
  renderPresupuestoTable();
}
function presConceptoColor(cn){
  return cn.color||CARGO_PASTEL_PALETTE[hashStr(cn.nombre)%CARGO_PASTEL_PALETTE.length];
}
async function setPresConceptoColor(id,color){
  const pc=presCompany();
  const cn=pc.conceptos.find(c=>c.id===id);
  if(!cn)return;
  cn.color=color;
  await savePresupuesto();
  renderPresupuestoTable();
}
function renderPresupuestoTable(){
  const pc=presCompany();
  const yearData=presYearData(presYear);
  const conceptos=pc.conceptos;
  const headRow1=`<tr><th rowspan="2" style="vertical-align:middle">PERIODO</th>${conceptos.map(cn=>`<th colspan="2" style="text-align:center;background:${presConceptoColor(cn)}"><span style="display:inline-flex;align-items:center;gap:6px;justify-content:center">${esc(cn.nombre)}<input type="color" class="no-print" value="${presConceptoColor(cn)}" title="Color de ${esc(cn.nombre)}" onchange="setPresConceptoColor('${cn.id}',this.value)" style="width:20px;height:20px;padding:0;border:1px solid #fff;border-radius:50%;cursor:pointer">${isAdmin()?`<button class="btn btn-danger btn-small no-print" onclick="removePresupuestoConcepto('${cn.id}')">✕</button>`:""}</span></th>`).join("")}</tr>`;
  const headRow2=`<tr>${conceptos.map(cn=>`<th style="text-align:center;background:${presConceptoColor(cn)}">Presupuestado</th><th style="text-align:center;background:${presConceptoColor(cn)}">Ejecutado</th>`).join("")}</tr>`;
  const totales={};
  conceptos.forEach(cn=>totales[cn.id]={presupuestado:0,ejecutado:0});
  const monthRows=MESES_CORTOS.map((m,mi)=>{
    const cells=conceptos.map(cn=>{
      const v=yearData[cn.id][mi];
      totales[cn.id].presupuestado+=v.presupuestado; totales[cn.id].ejecutado+=v.ejecutado;
      const bg=presConceptoColor(cn)+"55";
      return `<td class="num" style="background:${bg}"><input type="number" min="0" class="pres-input" data-concepto="${cn.id}" data-mes="${mi}" data-campo="presupuestado" value="${v.presupuestado||0}" style="width:95px"></td>
              <td class="num" style="background:${bg}"><input type="number" min="0" class="pres-input" data-concepto="${cn.id}" data-mes="${mi}" data-campo="ejecutado" value="${v.ejecutado||0}" style="width:95px"></td>`;
    }).join("");
    return `<tr><td>${m}</td>${cells}</tr>`;
  }).join("");
  const subtotalRow=`<tr style="font-weight:800"><td style="background:#f1f5f2">SUBTOTAL</td>${conceptos.map(cn=>`<td class="num" style="background:${presConceptoColor(cn)}">${money(totales[cn.id].presupuestado)}</td><td class="num" style="background:${presConceptoColor(cn)}">${money(totales[cn.id].ejecutado)}</td>`).join("")}</tr>`;
  const pctRow=`<tr style="font-weight:800"><td style="background:#f1f5f2">PORCENTAJE EJECUTADO</td>${conceptos.map(cn=>{const t=totales[cn.id];const pct=t.presupuestado>0?Math.round(t.ejecutado/t.presupuestado*100):0;return `<td colspan="2" style="text-align:center;background:${presConceptoColor(cn)}">${pct}%</td>`}).join("")}</tr>`;
  document.getElementById("pres-table-wrap").innerHTML=`<table><thead>${headRow1}${headRow2}</thead><tbody>${monthRows}</tbody><tfoot>${subtotalRow}${pctRow}</tfoot></table>`;
  document.querySelectorAll(".pres-input").forEach(inp=>inp.onchange=async e=>{
    const {concepto,mes,campo}=e.target.dataset;
    presYearData(presYear)[concepto][+mes][campo]=+e.target.value||0;
    await savePresupuesto();
    renderPresupuestoTable();
  });
}

async function addProceso(){
  const err=document.getElementById("pr-err");err.textContent="";
  const cedula=document.getElementById("pr-trabajador").value;
  const w=workersCompany().find(x=>x.cedula===cedula);
  const departamento=document.getElementById("pr-departamento").value.trim();
  const motivo=document.getElementById("pr-motivo").value.trim();
  const fechaApertura=document.getElementById("pr-apertura").value;
  const fechaDescargos=document.getElementById("pr-descargos").value;
  const fechaComunicado=document.getElementById("pr-comunicado").value;
  const accion=document.getElementById("pr-accion").value;
  const suspInicio=document.getElementById("pr-susp-inicio").value;
  const suspFin=document.getElementById("pr-susp-fin").value;
  const observaciones=document.getElementById("pr-obs").value.trim();
  const fArchivoApertura=document.getElementById("pr-archivo-apertura").files[0];
  const fArchivoDescargos=document.getElementById("pr-archivo-descargos").files[0];
  const fArchivoComunicado=document.getElementById("pr-archivo-comunicado").files[0];
  if(!w||!motivo||!fechaApertura){err.textContent="Selecciona un trabajador, el motivo y la fecha de apertura.";return}
  if(accion==="Suspensión"&&(!suspInicio||!suspFin)){err.textContent="Indica la fecha de inicio y de fin de la suspensión.";return}
  if(accion==="Suspensión"&&suspFin<suspInicio){err.textContent="La fecha de fin de suspensión no puede ser antes de la fecha de inicio.";return}
  const archivoApertura=fArchivoApertura?await fileToDataURL(fArchivoApertura):null;
  const archivoDescargos=fArchivoDescargos?await fileToDataURL(fArchivoDescargos):null;
  const archivoComunicado=fArchivoComunicado?await fileToDataURL(fArchivoComunicado):null;
  const diasSuspension=accion==="Suspensión"?(Math.round((new Date(suspFin+"T00:00:00")-new Date(suspInicio+"T00:00:00"))/86400000)+1):0;
  const proc={id:Date.now()+"",empresa:activeCompany,cedula,nombre:w.nombre,departamento,motivo,fechaApertura,archivoApertura,fechaDescargos,archivoDescargos,fechaComunicado,archivoComunicado,accion,suspInicio:accion==="Suspensión"?suspInicio:null,suspFin:accion==="Suspensión"?suspFin:null,diasSuspension,observaciones};
  procesos.push(proc);
  await saveProcesos();
  if(accion==="Suspensión"&&diasSuspension>0){
    records.push({id:Date.now()+"-susp","nombre":w.nombre,cedula,empresa:activeCompany,cargo:w.cargo,categoria:"Suspensión",entidad:null,inicio:suspInicio,fin:suspFin,dias:diasSuspension,observacion:"Proceso disciplinario: "+motivo,attachment:null,origen:"proceso",procesoId:proc.id});
    await saveRecords();
  }
  renderSection("procesos-disciplinarios");
}

  procesos=procesos.filter(p=>p.id!==id);
  records=records.filter(r=>!(r.origen==="proceso"&&r.procesoId===id));
  await saveProcesos(); await saveRecords();
  renderSection("procesos-disciplinarios");
}
